{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="card">
    <h2>Create Account</h2>

    <form method="post" action="{{ url_for('register') }}">

        <!-- CSRF Protection -->
        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            maxlength="30"
            autocomplete="username"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            maxlength="254"
            autocomplete="email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            minlength="12"
            autocomplete="new-password"
            required
        >

        <label for="confirm_password">Confirm Password</label>
        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            minlength="12"
            autocomplete="new-password"
            required
        >

        <button type="submit">Register</button>

    </form>
</div>

{% endblock %}
